name: android-build

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant to produce"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      module:
        description: "Gradle module that produces the APK (defaults to the app module)"
        required: false
        default: ":core:app"
        type: string

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      # Generate a real signing keystore at the path the build's signing plugin
      # expects (rootProject.buildDir/signing/signing-key.jks). Providing an
      # existing keystore lets the plugin apply a real signing config, avoiding
      # AGP's default debug-keystore generation which crashes on a BouncyCastle
      # classpath clash (NoSuchFieldError: xmss_SHAKE128_512ph).
      - name: Generate signing keystore
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/build/signing/signing-key.jks"
          mkdir -p "$(dirname "$KEYSTORE")"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias hmxide \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=HMX IDE,O=HMX,C=US"
          {
            echo "IDE_SIGNING_ALIAS=hmxide"
            echo "IDE_SIGNING_STORE_PASS=android"
            echo "IDE_SIGNING_KEY_PASS=android"
          } >> "$GITHUB_ENV"

      - name: Detect APK output path
        id: paths
        shell: bash
        run: |
          MODULE="${{ github.event.inputs.module }}"
          # Strip leading ":" and convert ":core:app" -> "core/app"
          REL="${MODULE#:}"
          REL="${REL//:/\/}"
          echo "apk_dir=${REL}/build/outputs/apk" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          [ -z "$TYPE" ] && TYPE="release"
          MODULE="${{ github.event.inputs.module }}"
          [ -z "$MODULE" ] && MODULE=":core:app"
          if [ "$TYPE" = "debug" ]; then
            ./gradlew "$MODULE:assembleDebug" --no-daemon --stacktrace
          else
            ./gradlew "$MODULE:assembleRelease" --no-daemon --stacktrace
          fi

      - name: Locate generated APK
        id: apk
        if: ${{ success() }}
        shell: bash
        run: |
          DIR="${{ steps.paths.outputs.apk_dir }}"
          APK=$(find "$DIR" -name '*.apk' -type f | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under $DIR"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: ${{ success() && steps.apk.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_type }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/
            **/build/*.log
          if-no-files-found: ignore
