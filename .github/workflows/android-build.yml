name: android-build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant to produce"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      module:
        description: "Gradle module that produces the APK (defaults to the app module)"
        required: false
        default: ":core:app"
        type: string

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Detect APK output path
        id: paths
        shell: bash
        run: |
          MODULE="${{ github.event.inputs.module }}"
          # Strip leading ":" and convert ":core:app" -> "core/app"
          REL="${MODULE#:}"
          REL="${REL//:/\/}"
          echo "apk_dir=${REL}/build/outputs/apk" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: ./gradlew ${{ github.event.inputs.module }}:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          if [ -z "${{ secrets.IDE_SIGNING_KEY_BIN }}" ]; then
            echo "::warning::Release signing is not configured. Producing an UNSIGNED release APK."
            ./gradlew ${{ github.event.inputs.module }}:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew ${{ github.event.inputs.module }}:assembleRelease --no-daemon --stacktrace
          fi
        env:
          IDE_SIGNING_ALIAS: ${{ secrets.IDE_SIGNING_ALIAS }}
          IDE_SIGNING_AUTH_PASS: ${{ secrets.IDE_SIGNING_AUTH_PASS }}
          IDE_SIGNING_AUTH_USER: ${{ secrets.IDE_SIGNING_AUTH_USER }}
          IDE_SIGNING_KEY_PASS: ${{ secrets.IDE_SIGNING_KEY_PASS }}
          IDE_SIGNING_STORE_PASS: ${{ secrets.IDE_SIGNING_STORE_PASS }}
          IDE_SIGNING_URL: ${{ secrets.IDE_SIGNING_URL }}
          IDE_SIGNING_KEY_BIN: ${{ secrets.IDE_SIGNING_KEY_BIN }}

      - name: Locate generated APK
        id: apk
        if: ${{ success() }}
        shell: bash
        run: |
          DIR="${{ steps.paths.outputs.apk_dir }}"
          APK=$(find "$DIR" -name '*.apk' -type f | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found under $DIR"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: ${{ success() && steps.apk.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_type }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/
            **/build/*.log
          if-no-files-found: ignore
