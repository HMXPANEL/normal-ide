name: Agent tests

# Targeted CI gate for HMX Agent development.
#
# Runs ONLY the Phase-specific Agent tests in :core:app
# (com.hmx.ide.ai.agent.*) instead of the full multi-module
# `runTestsInCI` fan-out. Full build.yml remains the final
# integration gate and is intentionally left untouched.
#
# Fails if any Agent test fails. Produces the standard Gradle
# test report as an artifact.

on:
  push:
    branches: [ "dev", "main", "master", "indexing", "release/**" ]
    paths:
      - 'core/app/src/main/java/com/hmx/ide/ai/**'
      - 'core/app/src/test/**'
      - '.github/workflows/agent-tests.yml'
  pull_request:
    branches: [ "dev", "main", "master" ]
    paths:
      - 'core/app/src/main/java/com/hmx/ide/ai/**'
      - 'core/app/src/test/**'
      - '.github/workflows/agent-tests.yml'
  workflow_dispatch: { }

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ORG_GRADLE_PROJECT_version: 'v0.1.0-dev'

jobs:
  agent_unit_tests:
    name: Run HMX Agent unit tests (:core:app filtered)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Run Agent unit tests
        run: ./gradlew :core:app:testDebugUnitTest --tests "com.hmx.ide.ai.agent.*"
        env:
          ANDROIDIDE_TEST: true
      - name: Upload Agent test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-agent-tests
          path: 'core/app/build/reports/tests/testDebugUnitTest/'
